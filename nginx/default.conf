server {
    listen 80 default_server;
    server_name _;

    root /var/www/html;
    index index.html;
    charset utf-8;

    server_tokens off;

    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /api.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/api.php;
        fastcgi_pass backend:9000;
    }

    location ~* \.php(?:/|$) {
        return 404;
    }

    location ~ /\. {
        return 404;
    }
}
