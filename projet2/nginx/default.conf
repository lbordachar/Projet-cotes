server {
    listen 80 default_server;
    server_name _;

    root /var/www/html;
    index index.html;
    charset utf-8;

    # Ne pas afficher la version de Nginx dans les réponses.
    server_tokens off;

    # Empêcher le navigateur de deviner un autre type de contenu.
    add_header X-Content-Type-Options nosniff always;

    # Le frontend sert uniquement les fichiers qui existent.
    location / {
        try_files $uri $uri/ =404;
    }

    # Seule cette URL est transmise au backend PHP.
    location = /api.php {
        include fastcgi_params;

        # Ce chemin désigne le fichier dans le conteneur backend.
        fastcgi_param SCRIPT_FILENAME /var/www/html/api.php;
        fastcgi_pass backend:9000;
    }

    # Bloquer les autres chemins PHP, y compris leurs sous-chemins.
    location ~* \.php(?:/|$) {
        return 404;
    }

    # Bloquer l'accès aux fichiers et dossiers cachés.
    location ~ /\. {
        return 404;
    }
}
